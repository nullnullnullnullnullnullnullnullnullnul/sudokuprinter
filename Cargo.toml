[package]
name = "sudokuprinter"
version = "0.1.0"
edition = "2021"
description = "Sudoku puzzle generator and queue. Thermal-ticket-printer output is on the roadmap."
license = "MIT"
repository = "https://github.com/nullnullnullnullnullnullnullnullnullnul/sudokuprinter"
readme = "README.md"
keywords = ["sudoku", "cli", "puzzle"]
categories = ["command-line-utilities", "games"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["serde", "v4"] }
